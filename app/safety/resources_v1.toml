# Crisis and emergency resources shown by the safety layer (app/safety/resources.py).
#
# Every entry comes from the crisis-resource research of 2026-10-13, which
# checked each one against the official page or document named in
# source_url ("verification" says how: official_page, official_doc, or
# search_index when the official page blocked the research environment and
# its content was seen through a search index only). No entry comes from
# Find A Helpline (findahelpline.com): its terms forbid using its data.
#
# The application, never the model, puts these strings into the reply
# guidance and fallback replies. Contacts are application text: a change of
# any value needs a new file version and a fresh check against the source.
#
# Region codes: ISO 3166-1 alpha-2 (IN, US, GB); "generic" is used when no
# region is configured. Generic entries contain no numbers: there is no
# number that works everywhere.

version = "1.0.0"
verified_on = 2026-10-13
# A unit test fails after this date, so the data cannot silently go stale.
review_due = 2027-01-11
changelog = ["1.0.0 (2026-10-13): Initial IN, US and GB set and a generic fallback."]

