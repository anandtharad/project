[project]
name = "companion-ai"
version = "0.1.0"
description = "English-first conversational companion: decision-controlled LLM application"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "alembic",
]

[project.optional-dependencies]
# Provider SDKs are optional; install the ones you use (uv sync --extra groq)
# or all of them (uv sync --all-extras). The app reports a clear error if the
# configured provider's SDK is missing.
anthropic = ["anthropic"]
openai = ["openai"]
groq = ["groq"]
gemini = ["google-genai"]

[dependency-groups]
dev = [
    "anthropic",
    "openai",
    "groq",
    "google-genai",
    "pytest",
    "pytest-asyncio",
    "httpx",
    "ruff",
    "mypy",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "integration: requires PostgreSQL (TEST_DATABASE_URL)",
    "live: calls a real LLM provider (RUN_LIVE_LLM_TESTS=1 and credentials)",
]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S", "RUF", "SIM"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
"migrations/versions/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["^migrations/versions/"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
