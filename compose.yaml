# Local development stack: PostgreSQL (with pgvector, for memory search),
# a one-shot migration job, and the API.
name: companion-ai

x-app-env: &app-env
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-companion}:${POSTGRES_PASSWORD:-companion}@db:5432/${POSTGRES_DB:-companion}
  # Inside compose the Laya server is reached by service name.
  LAYA_BASE_URL: http://laya:8100
  # The local embedding model (about 65 MB) is downloaded once into a volume.
  EMBEDDING_CACHE_DIR: /cache/fastembed

services:
  db:
    image: pgvector/pgvector:0.8.7-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-companion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-companion}
      POSTGRES_DB: ${POSTGRES_DB:-companion}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    env_file:
      - path: .env
        required: false
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy

  app:
    build: .
    env_file:
      - path: .env
        required: false
    environment: *app-env
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    volumes:
      - embedding-cache:/cache
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Optional self-hosted decision model. Start it with:
  #   docker compose --profile laya up -d laya
  # and set DECISION_PROVIDER=laya and LAYA_API_KEY in .env.
  laya:
    profiles: ["laya"]
    build:
      context: .
      dockerfile: docker/laya.Dockerfile
    environment:
      LAYA_HOST: 0.0.0.0  # inside the container; published on localhost only
      LAYA_PORT: "8100"
      LAYA_JEV_STRICT: "1"
      LAYA_MODELS: english
      LAYA_PRELOAD: "1"
      # Without a key laya-serve accepts any caller; the app requires one.
      LAYA_API_KEY: ${LAYA_API_KEY:-}
    ports:
      - "127.0.0.1:${LAYA_PORT:-8100}:8100"
    volumes:
      - laya-cache:/cache

volumes:
  pgdata:
  laya-cache:
  embedding-cache:
