# Reviewed knowledge sources (spec §11.2-11.3). See docs/rag.md and data/knowledge/README.md.
# Edit, then: uv run python scripts/fetch_knowledge.py --only <key> && uv run python scripts/ingest_knowledge.py
manifest_version = 1
review_note = "Selected and checked on 2026-10-15 by the developer's AI coding assistant for topic fit, licence and reuse terms, and content extraction. Not clinically reviewed: general wellbeing information only."

[defaults]
stop_headings = ["Reprints", "More Resources", "Learn more", "Learn More", "Featured videos", "Share this infographic", "You may also be interested in", "For More Information", "NCCIH Clearinghouse", "Know the Science", "PubMed®", "References", "Key References", "Selected References", "Acknowledgments", "Resources", "Related Resources", "More Information", "Spread the word about social isolation", "Watch our Emotional Well-Being video series", "Share", "Related", "See also"]
drop_text = ["This publication is not copyrighted.*", "Download (?:PDF|Publications).*", "Print this page\\.?"]

[profiles.nimh]
content = ["article#main_content_inner"]
drop = ["ul.pub_links", "div.pub-cover", "li.pagenav_item"]
drop_text = ["Esta p.gina tambi.n est. disponible en espa.ol\\.?", "View the related infographic.*", "Download PDF", "En espa.ol"]

[profiles.nccih]
content = ["main"]

[profiles.nia]
content = ["article.content_main"]

[profiles.cdc]
content = ["div.cdc-page-title h1, div.cdc-dfe-body__top, div.cdc-dfe-body__center"]

[profiles.medlineplus]
content = ["#topic .page-title h1, section#topsum_section"]

[profiles.odphp]
content = ["div.r-topic-content-container h1.node-title, div.r-topic-content-container div.c-panel__content"]

[profiles.niddk]
content = ["article.dk-content > h1, article.dk-content > div.health-detail-content"]

